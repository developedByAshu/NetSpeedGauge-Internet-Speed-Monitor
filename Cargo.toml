[workspace]
resolver = "2"
members = ["shared", "windows", "mac"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/developedByAshu/NetSpeedGauge-Internet-Speed-Monitor"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
