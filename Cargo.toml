[package]
name = "netspeedgauge"
version = "1.0.0"
edition = "2021"
description = "Tiny internet speed monitor for the Windows taskbar"
license = "GPL-3.0-only"
repository = "https://github.com/developedByAshu/NetSpeedGauge-Internet-Speed-Monitor"

[lib]
name = "netspeedgauge"
path = "src/lib.rs"

[[bin]]
name = "NetSpeedGauge"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
