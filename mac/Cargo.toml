[package]
name = "netspeedgauge-mac"
version.workspace = true
edition.workspace = true
description = "Tiny internet speed monitor for the Mac menu bar"
license.workspace = true
repository.workspace = true

[lib]
name = "netspeedgauge_mac"
path = "src/lib.rs"

[[bin]]
name = "NetSpeedGauge"
path = "src/main.rs"

# Runs on the main thread, which AppKit requires, so it uses its own runner.
[[test]]
name = "ui_flow_tests"
path = "tests/ui_flow_tests.rs"
harness = false

[dependencies]
netspeedgauge-shared = { path = "../shared" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
